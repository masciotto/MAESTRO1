<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAESTRO</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MAESTRO</h1>
        <p>Virtual Art in the Real World</p>
    </header>

    <main>
        <section class="location">
            <h2>La tua posizione</h2>

            <p>Latitudine: <strong id="latitude">---</strong></p>
            <p>Longitudine: <strong id="longitude">---</strong></p>
            <p>Precisione: <strong id="accuracy">---</strong></p>
            <p>Distanza dall’opera: <strong id="distance">---</strong></p>

            <button id="locationButton">TROVA / AGGIORNA POSIZIONE</button>
            <p id="status"></p>

            <!-- Pulsante AR -->
            <a id="arButton" rel="ar" href="cp //home/ciccino/Desktop/CAVEAU.jpeg" style="display:none;">

                APRI SE RIESCI
            </a>
        </section>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
